<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LandayanFinds</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Secular+One&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="login-page">

        <section class="auth-card">

            <h1>LOGIN</h1>
            <p class="auth-sub">Welcome back to LandayanFinds</p>

            <form id="loginForm">

                <div class="field">
                    <input type="email" name="email" placeholder="Email Address" autocomplete="email" required>
                </div>

                <div class="field">
                    <input type="password" name="password" placeholder="Password" autocomplete="current-password"
                        required>
                </div>

                <p id="loginMessage" role="status" aria-live="polite"></p>

                <button type="submit" class="btn auth-btn" id="loginButton">
                    Login
                </button>

            </form>

            <p class="auth-switch">
                Doesn't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </section>

    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = new FormData(loginForm);

            const data = {
                email: formData.get("email").trim(),
                password: formData.get("password")
            };

            loginMessage.textContent = "";
            loginMessage.style.color = "#c0392b";

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch("api/login.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || "Login failed.");
                }

                loginMessage.style.color = "#087f70";
                loginMessage.textContent = result.message;

                // Return to the public homepage
                setTimeout(function () {
                    window.location.href = "index.html";
                }, 700);

            } catch (error) {
                loginMessage.style.color = "#c0392b";
                loginMessage.textContent =
                    error.message || "Unable to connect to the server.";

                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>

</body>

</html>
