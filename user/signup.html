<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | LandayanFinds</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Secular+One&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="login-page signup-page">

        <section class="auth-card signup-card">

            <h1>SIGN UP</h1>
            <p class="auth-sub">Create your LandayanFinds account</p>

            <form id="signupForm">

                <div class="signup-grid">

                    <label class="signup-field">
                        <span>First Name</span>
                        <input type="text" name="first_name" placeholder="Enter first name" maxlength="100" required>
                    </label>

                    <label class="signup-field">
                        <span>Last Name</span>
                        <input type="text" name="last_name" placeholder="Enter last name" maxlength="100" required>
                    </label>

                    <label class="signup-field">
                        <span>Age</span>
                        <input type="number" name="age" placeholder="Enter age" min="15" max="100" required>
                    </label>

                    <label class="signup-field">
                        <span>Gender</span>
                        <select name="gender" required>
                            <option value="" disabled selected>Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </label>

                    <label class="signup-field">
                        <span>Email Address</span>
                        <input type="email" name="email" placeholder="Enter email address" maxlength="150" required>
                    </label>

                    <label class="signup-field">
                        <span>Phone Number</span>
                        <input type="tel" name="phone_number" placeholder="Enter phone number" maxlength="30" required>
                    </label>

                    <label class="signup-field">
                        <span>Password</span>
                        <input type="password" name="password" placeholder="Create password" minlength="8" required>
                    </label>

                    <label class="signup-field">
                        <span>Confirm Password</span>
                        <input type="password" name="confirm_password" placeholder="Confirm password" minlength="8"
                            required>
                    </label>

                    <label class="signup-field full-width">
                        <span>Account Type</span>
                        <select name="account_type" required>
                            <option value="" disabled selected>Select account type</option>
                            <option value="job_seeker">Job Seeker</option>
                            <option value="business_owner">Business Owner</option>
                        </select>
                    </label>

                </div>

                <p id="signupMessage" role="status" aria-live="polite"></p>

                <button type="submit" class="btn auth-btn" id="signupButton">
                    Sign Up
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Log In</a>
            </p>

        </section>

    </main>

    <script>
        const signupForm = document.getElementById("signupForm");
        const signupMessage = document.getElementById("signupMessage");
        const signupButton = document.getElementById("signupButton");

        signupForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = new FormData(signupForm);

            const data = {
                first_name: formData.get("first_name").trim(),
                last_name: formData.get("last_name").trim(),
                age: formData.get("age"),
                gender: formData.get("gender"),
                email: formData.get("email").trim(),
                phone_number: formData.get("phone_number").trim(),
                password: formData.get("password"),
                confirm_password: formData.get("confirm_password"),
                account_type: formData.get("account_type")
            };

            signupMessage.textContent = "";
            signupMessage.style.color = "#c0392b";

            if (data.password !== data.confirm_password) {
                signupMessage.textContent = "Passwords do not match.";
                return;
            }

            signupButton.disabled = true;
            signupButton.textContent = "Creating Account...";

            try {
                const response = await fetch("api/signup.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || "Registration failed.");
                }

                signupMessage.style.color = "#087f70";
                signupMessage.textContent = result.message;

                signupForm.reset();

            } catch (error) {
                signupMessage.style.color = "#c0392b";
                signupMessage.textContent =
                    error.message || "Unable to connect to the server.";
            } finally {
                signupButton.disabled = false;
                signupButton.textContent = "Sign Up";
            }
        });
    </script>

</body>

</html>
