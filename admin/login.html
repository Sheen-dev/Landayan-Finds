<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | LandayanFinds</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Secular+One&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <a class="logo">Landayan<span>Finds</span></a>

            <div class="login-heading">
                <span class="admin-label">ADMINISTRATION</span>
                <p>Sign in to access the admin dashboard.</p>
            </div>

            <form id="login-form">

                <div class="form-group">
                    <label for="email">Admin User</label>
                    <input type="text" id="email" placeholder="Enter Admin user" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                </div>

                <p id="login-error" class="login-error" role="alert"></p>

                <button type="submit" class="login-button">
                    Sign In
                </button>

            </form>

            <p class="login-footer">
                LandayanFinds Admin Panel
            </p>

        </div>

    </main>

    <script src="login.js"></script>

</body>

</html>
